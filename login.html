<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrar | Aprova Concursos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(114, 92, 255, 0.20), transparent 45%),
        #080b16;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .logo span {
      color: #725cff;
    }

    .login-box {
      background: #12182a;
      border: 1px solid #252b40;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .login-box h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca6bd;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #dce1ef;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0b1020;
      border: 1px solid #2a324a;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #725cff;
      box-shadow: 0 0 0 3px rgba(114,92,255,.10);
    }

    .password-area {
      position: relative;
    }

    .password-area input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #9ca6bd;
      cursor: pointer;
      font-size: 12px;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -5px;
      margin-bottom: 22px;
      color: #8f82ff;
      text-decoration: none;
      font-size: 12px;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #725cff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: .2s;
    }

    .button:hover {
      background: #5d4be8;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #69738c;
      font-size: 12px;
      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #252b40;
    }

    .register {
      text-align: center;
      color: #9ca6bd;
      font-size: 14px;
    }

    .register a {
      color: #8f82ff;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #737d96;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Aprova<span>Concursos</span>
    </div>

    <div class="login-box">

      <h1>Bem-vindo de volta</h1>

      <p class="subtitle">
        Entre na sua conta para continuar estudando.
      </p>

      <form>

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="seuemail@email.com"
            required
          >
        </div>

        <div class="form-group">

          <label for="password">Senha</label>

          <div class="password-area">

            <input
              type="password"
              id="password"
              placeholder="Digite sua senha"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="mostrarSenha()"
            >
              Mostrar
            </button>

          </div>

        </div>

        <a href="#" class="forgot">
          Esqueci minha senha
        </a>

        <button type="submit" class="button">
          Entrar
        </button>

      </form>

      <div class="divider">
        ou
      </div>

      <div class="register">
        Ainda não possui uma conta?
        <a href="#">
          Criar conta
        </a>
      </div>

    </div>

    <a href="index.html" class="back">
      ← Voltar para o início
    </a>

  </div>

  <script>

    function mostrarSenha() {

      const senha = document.getElementById("password");
      const botao = document.querySelector(".show-password");

      if (senha.type === "password") {

        senha.type = "text";
        botao.textContent = "Ocultar";

      } else {

        senha.type = "password";
        botao.textContent = "Mostrar";

      }

    }

  </script>

</body>
</html>
