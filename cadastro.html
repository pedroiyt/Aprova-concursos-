<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar conta | Aprova Concursos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(114, 92, 255, 0.20), transparent 45%),
        #080b16;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .logo span {
      color: #725cff;
    }

    .box {
      background: #12182a;
      border: 1px solid #252b40;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca6bd;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #dce1ef;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0b1020;
      border: 1px solid #2a324a;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #725cff;
      box-shadow: 0 0 0 3px rgba(114,92,255,.10);
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #725cff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 7px;
    }

    .button:hover {
      background: #5d4be8;
    }

    .login {
      text-align: center;
      color: #9ca6bd;
      font-size: 14px;
      margin-top: 25px;
    }

    .login a {
      color: #8f82ff;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #737d96;
      text-decoration: none;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .box {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Aprova<span>Concursos</span>
    </div>

    <div class="box">

      <h1>Criar sua conta</h1>

      <p class="subtitle">
        Comece agora sua preparação para a aprovação.
      </p>

      <form>

        <div class="form-group">
          <label for="nome">Nome completo</label>

          <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="seuemail@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>

          <input
            type="password"
            id="senha"
            placeholder="Crie uma senha"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmar">Confirmar senha</label>

          <input
            type="password"
            id="confirmar"
            placeholder="Digite a senha novamente"
            required
          >
        </div>

        <button type="submit" class="button">
          Criar minha conta
        </button>

      </form>

      <div class="login">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
      </div>

    </div>

    <a href="index.html" class="back">
      ← Voltar para o início
    </a>

  </div>

</body>
</html>
