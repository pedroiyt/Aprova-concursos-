<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aprova Concursos | Sua aprovação começa aqui</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --bg: #080b16;
      --bg2: #0d1120;
      --card: #12182a;
      --card2: #171e34;
      --border: #252e49;
      --primary: #705cff;
      --primary-dark: #5847e8;
      --text: #ffffff;
      --muted: #9da7c0;
      --green: #35d07f;
    }

    body {
      background:
        radial-gradient(circle at 80% 10%, rgba(112,92,255,.15), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */

    header {
      height: 74px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,22,.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo span {
      color: var(--primary);
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: .2s;
    }

    nav a:hover {
      color: white;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .login {
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
    }

    .register {
      color: white;
      text-decoration: none;
      background: var(--primary);
      padding: 11px 17px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
      transition: .2s;
    }

    .register:hover,
    .main-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* HERO */

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 100px 25px 80px;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 60px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: rgba(112,92,255,.12);
      border: 1px solid rgba(112,92,255,.3);
      color: #bcb5ff;
      padding: 8px 13px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(40px, 5vw, 64px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
      max-width: 600px;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .main-button {
      display: inline-block;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 15px 23px;
      border-radius: 10px;
      font-weight: bold;
      transition: .2s;
    }

    .secondary-button {
      display: inline-block;
      background: transparent;
      color: white;
      text-decoration: none;
      padding: 15px 23px;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: .2s;
    }

    .secondary-button:hover {
      background: var(--card);
    }

    /* DASHBOARD PREVIEW */

    .preview {
      background: linear-gradient(145deg, #141b30, #0e1425);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .preview-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .preview-title {
      font-size: 14px;
      font-weight: bold;
    }

    .online {
      color: var(--green);
      font-size: 11px;
    }

    .progress-card {
      background: var(--card2);
      padding: 18px;
      border-radius: 13px;
      margin-bottom: 12px;
    }

    .progress-card small {
      color: var(--muted);
    }

    .progress-number {
      font-size: 27px;
      font-weight: bold;
      margin: 8px 0;
    }

    .progress-bar {
      height: 7px;
      background: #252d43;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 78%;
      height: 100%;
      background: var(--primary);
      border-radius: 10px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mini-card {
      background: var(--card2);
      border-radius: 13px;
      padding: 17px;
    }

    .mini-card .icon {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .mini-card strong {
      display: block;
      font-size: 20px;
    }

    .mini-card span {
      color: var(--muted);
      font-size: 12px;
    }

    /* STATS */

    .stats {
      max-width: 1100px;
      margin: 0 auto 70px;
      padding: 0 25px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .stat {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 24px 15px;
      border-radius: 13px;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* FEATURES */

    .section {
      max-width: 1100px;
      margin: auto;
      padding: 30px 25px 90px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 40px;
